# Render Blueprint for CRO Toolbox (Render → New → Blueprint → pick this repo).
# Nothing here is created until you apply it in the Render dashboard.
services:
  - type: web
    name: cro-toolbox
    runtime: node
    # "starter" is a paid plan (no sleeping). "free" sleeps after ~15 min idle — fine for testing,
    # not for App Store review or real merchants. See docs/hosting.md.
    plan: starter
    # Next to Shopify's API (US East): every admin page makes Shopify API calls, often two rounds
    # in a row, so this region keeps pages fast. Put the Supabase project in us-east-1 too.
    region: virginia
    buildCommand: npm ci --include=dev && npm run build:production
    startCommand: npm run start:production
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: SHOPIFY_API_KEY
        sync: false        # Partner Dashboard → app → Client ID
      - key: SHOPIFY_API_SECRET
        sync: false        # Partner Dashboard → app → Client secret
      - key: SHOPIFY_APP_URL
        sync: false        # https://cro-toolbox.onrender.com
      - key: SCOPES
        value: read_files,write_files,read_returns,write_returns,write_online_store_pages,read_orders,read_products,write_products,write_publications,read_themes,write_cart_transforms,write_delivery_customizations,write_discounts,write_metaobject_definitions,write_metaobjects,write_payment_customizations,write_validations   # must match shopify.app.toml
      # Live tracking (docs/research/tracking-returns.md section 9)
      - key: TRACKING_KEY_SECRET
        sync: false        # any long random text: encrypts the tracking keys merchants paste (never change it once keys are saved)
      - key: TRACKING_PROVIDER_KEY
        sync: false        # our own account key for the included live tracking (Pro). Empty: live tracking falls back to Shopify's data
      - key: SUPPORT_EMAIL
        sync: false        # shown on /privacy as the contact address (the listing's privacy policy URL)
      - key: DATABASE_URL
        sync: false        # Supabase → Connect → Session pooler (…pooler.supabase.com:5432/postgres) — Render is a long-running server
      - key: DIRECT_URL
        sync: false        # same Session pooler URL (used by prisma migrate deploy)
      # Billing (Shopify App Pricing) — see docs/billing.md. Plans themselves live in the Partner Dashboard.
      - key: CRO_APP_HANDLE
        sync: false        # the app's handle (Partner Dashboard → app) — used in the plan selection page URL; defaults to the-ultimate-cro-app (leave it empty)
      - key: SHOPIFY_PARTNER_ORG_ID
        sync: false        # Partner Dashboard URL: partners.shopify.com/<this number>/…
      - key: SHOPIFY_PARTNER_API_TOKEN
        sync: false        # Partner Dashboard → Settings → Partner API clients → token with "Manage apps"
      - key: SHOPIFY_APP_GID
        sync: false        # the app's id (gid://shopify/App/<number>) — Partner Dashboard → app URL
