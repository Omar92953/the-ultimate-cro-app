query CartDeliveryOptionsTransformRunInput {
  cart {
    cost { subtotalAmount { amount } }
    lines { merchandise { __typename ... on ProductVariant { product { id } } } }
    deliveryGroups {
      deliveryAddress { countryCode }
      deliveryOptions { handle title cost { amount } }
    }
    buyerIdentity { customer { numberOfOrders } }
  }
  deliveryCustomization {
    metafield(namespace: "$app", key: "function-configuration") { jsonValue }
  }
}
