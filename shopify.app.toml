  name = "Desktop image"
  type = "file_reference"

  [metaobjects.app.cro_hero.fields.image_mobile]
  name = "Mobile image"
  type = "file_reference"

  [metaobjects.app.cro_hero.fields.position]
  name = "Order"
  type = "number_integer"

  [metaobjects.app.cro_hero.fields.config]
  name = "Settings"
  type = "json"

  [metaobjects.app.cro_hero.fields.draft]
  name = "Preview settings"
  type = "json"

  [metaobjects.app.cro_hero.fields.draft_desktop]
  name = "Preview desktop image"
  type = "file_reference"

  [metaobjects.app.cro_hero.fields.draft_mobile]
  name = "Preview mobile image"
