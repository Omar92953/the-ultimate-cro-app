[metaobjects.app.cro_review]
name = "CRO review"
display_name_field = "name"
access.admin = "merchant_read"
access.storefront = "public_read"

  [metaobjects.app.cro_review.fields.name]
  name = "Customer name"
  type = "single_line_text_field"
  required = true

  [metaobjects.app.cro_review.fields.text]
  name = "Review"
  type = "multi_line_text_field"

  [metaobjects.app.cro_review.fields.rating]
  name = "Stars (1–5)"
  type = "number_integer"

  [metaobjects.app.cro_review.fields.media]
  name = "Photo or video"
  type = "file_reference"

  [metaobjects.app.cro_review.fields.source]
  name = "Source"
  type = "single_line_text_field"
  validations.choices = [ "whatsapp", "instagram", "tiktok", "facebook", "google", "x", "snapchat", "youtube", "email", "website", "other" ]

  [metaobjects.app.cro_review.fields.source_url]
  name = "Link to the original"
  type = "url"

  [metaobjects.app.cro_review.fields.product]
  name = "Product"
  type = "product_reference"

  [metaobjects.app.cro_review.fields.location]
  name = "Location"
  type = "single_line_text_field"

  [metaobjects.app.cro_review.fields.date]
  name = "Date"
  type = "date"

  [metaobjects.app.cro_review.fields.verified]
  name = "Verified buyer"
  type = "boolean"

  [metaobjects.app.cro_review.fields.featured]
  name = "Featured"
  type = "boolean"

  [metaobjects.app.cro_review.fields.active]
  name = "Shown"
  type = "boolean"

  [metaobjects.app.cro_review.fields.position]
  name = "Order"
  type = "number_integer"

# A frequently asked question.
[metaobjects.app.cro_faq]
name = "CRO FAQ"
display_name_field = "question"
access.admin = "merchant_read"
access.storefront = "public_read"

  [metaobjects.app.cro_faq.fields.question]
