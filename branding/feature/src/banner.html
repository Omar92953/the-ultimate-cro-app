<!doctype html>
<html><head><meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1600px; height: 900px; overflow: hidden; }
  body {
    font-family: Inter, -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #1d2a22 0%, #0b0b0f 60%);
    color: #fff; position: relative;
  }
  .top { position: absolute; top: 44px; left: 0; right: 0; text-align: center; }
  .logo { height: 40px; }
  h1 { font-size: 58px; line-height: 1.08; font-weight: 800; letter-spacing: -1.5px; margin-top: 26px; }
  h1 span { color: #3ddc84; }
  .checks { margin-top: 22px; display: flex; gap: 30px; justify-content: center; font-size: 19px; color: #c9d1cc; }
  .checks b { color: #3ddc84; margin-right: 8px; }
  .card { position: absolute; background: #fff; border-radius: 18px; padding: 16px;
          box-shadow: 0 24px 60px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.06); }
  .card img { display: block; width: 100%; border-radius: 10px; }
  .tag { position: absolute; top: -15px; left: 18px; background: #3ddc84; color: #0b0b0f;
         font-size: 14px; font-weight: 700; padding: 5px 12px; border-radius: 999px; }
</style></head>
<body>
  <div class="top">
    <img class="logo" src="logo.svg" alt="">
    <h1>Upsells, cross sells and <span>bundles</span><br>for any theme</h1>
    <div class="checks">
      <div><b>✓</b>Real discounts at checkout</div>
      <div><b>✓</b>Works in your theme's own cart</div>
      <div><b>✓</b>Offers after purchase</div>
      <div><b>✓</b>Order tracking and returns</div>
    </div>
  </div>

  <div class="card" style="left:64px; top:350px; width:470px"><span class="tag">Bundles</span><img src="w-fbt.png"></div>
  <div class="card" style="left:64px; top:762px; width:470px; padding:12px 16px"><span class="tag">Free shipping bar</span><img src="w-ship.png"></div>
  <div class="card" style="left:566px; top:350px; width:470px"><span class="tag">Quantity breaks</span><img src="w-qty.png"></div>
  <div class="card" style="left:620px; top:612px; width:362px"><span class="tag">Cart offers</span><img src="w-cart.png"></div>
  <div class="card" style="left:1068px; top:350px; width:470px"><span class="tag">After purchase offer</span><img src="w-post.png"></div>
  <div class="card" style="left:1122px; top:640px; width:362px"><span class="tag">Reviews</span><img src="w-review.png"></div>
</body></html>
